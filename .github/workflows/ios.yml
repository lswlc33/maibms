name: iOS

# iOS 是**编译目标**（第一交付平台是 Android）：这个工作流保证 iOS 侧始终「能编、能链」，
# 并产出未签名 ipa 供自签安装（见 README「iOS 构建」一节）。自签能装起来的前提是 .app 里
# 只有一个 Mach-O，所以关掉了 Xcode 16 Debug 默认的 debug dylib（见 iosApp/project.yml）。
#
# 为什么必须在 macOS runner 上跑：Apple 目标只能用 Apple 工具链（Xcode + Kotlin/Native，
# 首次还要下载 ~1GB konan 工具链），Windows/Linux 上连编译都做不了。
on:
  push:
    branches: [main, ios-target]
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS framework (compile & link) + unsigned ipa
    # macos-15：随附 Xcode 16。xcodegen 2.46 生成的工程是 Xcode 16 的格式（objectVersion 77），
    # macos-14 的 Xcode 15.4 读不了——报「future Xcode project file format (77)」
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 依赖与构建缓存（Compose iOS 依赖树不小，缓存能省几分钟）
      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native 工具链（~/.konan，约 1GB）：只在首次下载，缓存住后续运行
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build tools info
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version 2>/dev/null || true

      # 第一步先做公共代码的平台中立性检查：commonMain 若混入 JVM 专属 API（java.* / System.* /
      # String.format 等），metadata 编译会直接失败——比等到 K/N 编译到一半才发现快得多
      - name: Compile common metadata (platform-neutrality gate)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:compileCommonMainKotlinMetadata

      # 编译 + 链接两档 iOS framework：arm64 真机（iosArm64）与 arm64 模拟器（iosSimulatorArm64）。
      # 静态 framework 不需要签名，无 Apple 账号也能完整走通链接
      - name: Compile & link iOS frameworks
        run: |
          ./gradlew --no-daemon \
            :composeApp:linkDebugFrameworkIosArm64 \
            :composeApp:linkDebugFrameworkIosSimulatorArm64

      # 打包未签名 ipa：Xcode 工程由 xcodegen 从 iosApp/project.yml 生成（工程文件不入库），
      # 关掉签名（CODE_SIGNING_ALLOWED=NO）产出 .app，再按 ipa 的目录结构手工打成 zip。
      # 用户可在 Windows 上用 Sideloadly/爱思 这类工具自签安装（免费 Apple ID 签 7 天）。
      - name: Build unsigned ipa
        run: |
          set -euo pipefail
          brew install xcodegen
          cd iosApp && xcodegen generate && cd ..
          echo "--- 工程格式（诊断用）---"
          grep -m1 objectVersion iosApp/iosApp.xcodeproj/project.pbxproj || true
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          APP="build/ios-dd/Build/Products/Debug-iphoneos/iosApp.app"
          test -d "$APP" || { echo "::error::未产出 $APP"; exit 1; }
          echo "--- .app 内容 ---"
          ls -la "$APP"
          test -f "$APP/iosApp" || { echo "::error::未找到可执行文件"; exit 1; }
          # 静态 framework 是**链接进**主执行文件里的（不嵌入 Frameworks/），Compose 运行时有没有
          # 真链进去，看主执行文件大小最直接
          echo "--- .app 体积构成 ---"
          du -sh "$APP"/* 2>/dev/null | sort -rh | head -6
          EXEC_MB=$(( $(stat -f%z "$APP/iosApp") / 1048576 ))
          echo "主执行文件: ${EXEC_MB}MB"
          if [ "$EXEC_MB" -lt 20 ]; then
            echo "::error::主执行文件只有 ${EXEC_MB}MB，疑似 Compose 运行时未链入"
            exit 1
          fi
          # 自签安装的前提：.app 里只能有主执行文件一个 Mach-O。多出来的 dylib（Xcode 16 Debug
          # 默认产出的 iosApp.debug.dylib 与 __preview.dylib）自签工具多半漏签，装到手机上启动时
          # 会被 dyld 以签名无效拒掉——这种包必须在 CI 就红掉，别让它流到设备上
          MACHO=$(find "$APP" -type f -exec file {} + | grep -c "Mach-O" || true)
          echo "Mach-O 文件数: $MACHO"
          file "$APP"/* 2>/dev/null | grep "Mach-O" || true
          if [ "$MACHO" -ne 1 ]; then
            echo "::error::.app 里有 $MACHO 个 Mach-O（应只有 1 个）——检查 ENABLE_DEBUG_DYLIB 是否被改回默认"
            exit 1
          fi
          ls -la "$APP/Frameworks" 2>/dev/null || echo "(静态 framework：Frameworks 为空属正常)"
          echo "--- 二进制链接情况 ---"
          otool -L "$APP/iosApp" | head -6
          # 手工打成 ipa（Payload/ 目录 + zip）
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "maibms-unsigned.ipa" Payload)
          ls -la build/ipa/maibms-unsigned.ipa

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ipa/maibms-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 产物自检：framework 目录、二进制架构、大小——空产物或架构不符要在这里红掉
      - name: Verify framework artifacts
        run: |
          set -euo pipefail
          BASE=composeApp/build/bin
          for ARCH in iosArm64 iosSimulatorArm64; do
            FW="$BASE/$ARCH/debugFramework/ComposeApp.framework"
            test -d "$FW" || { echo "::error::未找到 $FW"; exit 1; }
            BIN="$FW/ComposeApp"
            test -f "$BIN" || { echo "::error::未找到二进制 $BIN"; exit 1; }
            echo "--- $ARCH ---"
            lipo -info "$BIN"
            ls -la "$FW" | head -10
            SIZE=$(stat -f%z "$BIN")
            echo "$ARCH binary size: $SIZE bytes"
            if [ "$SIZE" -lt 1000000 ]; then
              echo "::error::$ARCH framework 二进制只有 ${SIZE}B，疑似没有真正链进 Compose 运行时"
              exit 1
            fi
            cp "$FW/ComposeApp" "/tmp/ComposeApp-$ARCH"
          done

      - name: Upload frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          # framework 目录里有符号链接，tar 打包后再上传（zip 对 symlink 处理不一致）
          path: |
            composeApp/build/bin/iosArm64/debugFramework/ComposeApp.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
          if-no-files-found: error
          retention-days: 14

      # 运行时冒烟：在模拟器里把 App 装起来、launch、确认进程能活过启动头几秒。
      # 这能抓住「能编译能链接但一启动就崩」的坑——dyld 缺库、ObjC selector 找不到、
      # Kotlin 运行时没初始化、Compose/Skia 资源加载失败、Info.plist 缺键等，都是上面
      # 静态核检（体积/Mach-O 数/链接表）看不见的。真机上的签名问题这里测不到，但
      # 「代码层面一启动就崩」这类问题，模拟器与真机基本同步。
      - name: Simulator launch smoke test
        run: |
          set -euo pipefail

          # 找一台可用的 iPhone 模拟器（GitHub macOS runner 自带 iOS 运行时）。
          # 用文本解析而不是 -j：`simctl list` 的 JSON 旗标位置在不同 Xcode 版本间不一致，
          # 文本形式 `iPhone 16 Pro (UDID) (Shutdown)` 用括号取 UDID 最稳
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "::error::没有可用模拟器，simctl 输出如下："
            xcrun simctl list devices available || true
            xcrun simctl list runtimes || true
            exit 1
          fi
          echo "模拟器 UDID: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          # 模拟器构建：不关签名，让 Xcode 用默认 ad-hoc 签名（模拟器不校验团队身份）
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build/ios-sim-dd \
            build | tail -40

          APP="build/ios-sim-dd/Build/Products/Debug-iphonesimulator/iosApp.app"
          test -d "$APP" || { echo "::error::未产出 $APP"; exit 1; }

          xcrun simctl install "$UDID" "$APP"
          PID=$(xcrun simctl launch "$UDID" io.github.lswlc33.maibms | awk '{print $NF}')
          echo "launch PID: $PID"
          sleep 15
          if ps -p "$PID" >/dev/null 2>&1; then
            echo "✅ App 启动后进程存活（PID $PID）"
            xcrun simctl io "$UDID" screenshot build/ios-smoke.png
          else
            xcrun simctl io "$UDID" screenshot build/ios-smoke-crash.png 2>/dev/null || true
            echo "::error::App 启动后进程退出，疑似启动崩溃"
            echo "--- 崩溃报告 ---"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
            CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/iosApp-*.ips 2>/dev/null | head -1)
            if [ -n "$CRASH" ]; then sed -n '1,90p' "$CRASH"; fi
            echo "--- 统一日志（iosApp 进程）---"
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "iosApp"' 2>/dev/null | tail -50 || true
            exit 1
          fi

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-screenshot
          path: build/ios-smoke.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### iOS 构建验证通过"
            echo ""
            echo "- ✅ commonMain 平台中立性（metadata 编译）"
            echo "- ✅ iosArm64（真机）framework 编译 + 链接"
            echo "- ✅ iosSimulatorArm64（模拟器）framework 编译 + 链接"
            echo "- ✅ 未签名 ipa 打包（Xcode 工程由 xcodegen 生成）"
            echo "- ✅ 模拟器安装 + 启动冒烟（进程活过启动头 15 秒）"
            echo ""
            echo "产物：\`ios-frameworks\`（两档 debugFramework）、\`ios-unsigned-ipa\`（可直接自签安装）、"
            echo "\`ios-smoke-screenshot\`（模拟器启动后的界面截图）"
            echo "注：ipa 未签名，需用 Sideloadly/爱思 等工具以你的 Apple ID 自签后安装。"
          } >> "$GITHUB_STEP_SUMMARY"
