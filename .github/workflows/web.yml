name: Web · 同步网页版到 docs

# 网页版的发布位置是 `docs/web.html`（Pages 的发布目录就是 docs/，legacy 模式直接读分支文件），
# 所以构建产物**必须提交进仓库**。这个工作流负责在源码变化后重新生成并提交，
# 避免"改了代码但线上页面还是旧的"这种看不见的漂移。
#
# 只在相关路径变化时触发；产物无变化时（例如只改了注释）不产生空提交。
on:
  push:
    branches: [main]
    paths:
      - 'webApp/src/**'
      - 'webApp/tests/**'
      - 'webApp/build.gradle.kts'
      - 'docs/web/**/*.js'              # 手写 JS/CSS 也参与四页资源版本哈希
      - 'docs/web/**/*.css'
      - 'composeApp/build.gradle.kts'   # Web 版本名/版本号来源
      - 'composeApp/src/commonMain/**'   # 引擎源码被 webApp 直接复用，改协议要重新出包
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-sync
  cancel-in-progress: true

jobs:
  sync:
    name: 重新生成并提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/JS 的 npm 工具链约 80MB：缓存住，否则每次都要现装
      - name: Cache Kotlin/JS npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/yarn
            build/js/node_modules
          key: kotlinjs-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: 构建并同步到 docs/
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # syncWebToDocs 会构建数据层、拷进 docs/，并校验四套主题页仍在
          ./gradlew --no-daemon :webApp:syncWebToDocs
          # 数据层与四页本站资源的 ?v= 都由 syncWebToDocs 更新
          test -f docs/maibms-data.js || { echo "::error::docs/maibms-data.js 未生成"; exit 1; }
          ls -la docs/maibms-data.js
          ls -la docs/web/

      # 传输层是纯异步的（连接/订阅/分片/掉线），只靠人工真机试极容易漏。
      # 这个脚本把**刚构建出的产物**放进 Node VM + 假 GATT 里跑完整链路。
      - name: 连接链路回归测试
        run: node webApp/tests/verify-connect.mjs

      - name: 提交产物（无变化则跳过）
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 显式提交数据层和四页资源版本号；不宽泛 stage docs/，不提交其他手写源码
          git add -- docs/maibms-data.js docs/web/index.html docs/web/mdui.html docs/web/console.html docs/web/switch.html
          if git diff --cached --quiet; then
            echo "网页版产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(web): 同步网页版产物到 docs [skip ci]"
          git push