name: Release · 正式版

# 手动发布正式版：
#   Actions -> Release · 正式版 -> Run workflow（version 留空则自动把版本号末位 +1）
#
# 流程：算版本号 -> APK 与 ipa 并行构建（都带上新版本号，但**先不提交**）->
#       两个包都成功后才提交版本号、打 tag、发布正式 Release 并挂上两个产物。
# 这样失败时不会往 main 留「已自增未发布」的提交。
#
# 「最快的速度 + 最小的包」与 beta 工作流同源：两个 job 并行、ipa 走 Release 配置、
# APK 复用 Gradle 里已开的 R8 + 资源收缩。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '新的 versionName（例如 0.2.0）。留空则自动把末位 +1'
        required: false
      notes:
        description: '发布说明（留空自动生成）'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      old_code: ${{ steps.v.outputs.old_code }}
      old_name: ${{ steps.v.outputs.old_name }}
      code: ${{ steps.v.outputs.code }}
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          GRADLE_FILE=composeApp/build.gradle.kts
          if [ -n "$VERSION_INPUT" ]; then
            # 入口校验：只收 x.y.z 纯数字版本。特殊字符（& / ; 等）会破坏下游 sed；
            # RC 之类的预发布语义未在此定义，预发布一律走 Beta 工作流
            if ! echo "$VERSION_INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version 输入 '$VERSION_INPUT' 不是 x.y.z 格式（如 0.2.0）；预发布请走 Beta 工作流"
              exit 1
            fi
          fi
          OLD_CODE="$(grep -oE 'versionCode = [0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')"
          OLD_NAME="$(grep -oE 'versionName = "[^"]*"' "$GRADLE_FILE" | head -1 | cut -d'"' -f2)"
          NEW_CODE=$((OLD_CODE + 1))
          if [ -n "$VERSION_INPUT" ]; then
            NEW_NAME="$VERSION_INPUT"
          else
            # 末位自增：0.1.0 -> 0.1.1；BEGIN{OFS} 必须在改字段前设置，否则重建出来会变成 "0 1 1"
            NEW_NAME="$(echo "$OLD_NAME" | awk -F. 'BEGIN{OFS="."} { $NF = $NF + 1; print }')"
          fi
          case "$NEW_NAME" in
            *beta*|*alpha*|*Beta*|*Alpha*)
              echo "::error::'$NEW_NAME' 看着像预发布版本；beta 由 Beta 工作流发布"
              exit 1 ;;
          esac
          if [ "$NEW_NAME" = "$OLD_NAME" ]; then
            echo "::error::'$NEW_NAME' 已是当前版本——请传入新的 versionName，或留空让它自增"
            exit 1
          fi
          echo "version: ${OLD_NAME} (${OLD_CODE}) -> ${NEW_NAME} (${NEW_CODE})"
          {
            echo "old_code=${OLD_CODE}"
            echo "old_name=${OLD_NAME}"
            echo "code=${NEW_CODE}"
            echo "name=${NEW_NAME}"
            echo "tag=${NEW_CODE}-${NEW_NAME}"
          } >> "$GITHUB_OUTPUT"

  apk:
    name: 构建 APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 写入新版本号（只改工作区，不提交）
        env:
          CODE: ${{ needs.version.outputs.code }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          sed -i "s/versionCode = [0-9]\+/versionCode = ${CODE}/" composeApp/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${NAME}\"/" composeApp/build.gradle.kts
          grep -E 'versionCode|versionName' composeApp/build.gradle.kts

      # runner 自带 Android SDK（ANDROID_SDK_ROOT）；不用 android-actions/setup-android，
      # 它的新版本会因为已移除的 legacy "tools" 包而失败
      - name: Ensure Android platform and build-tools
        run: |
          set -euo pipefail
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "::warning::cmdline-tools/sdkmanager 不可用，跳过显式安装（依赖镜像预装组件）"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:desktopTest

      - name: Build signed APK
        id: build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 四个 secret 缺一不可：Gradle 端 hasReleaseSigning 要求全部非空，否则会
          # 静默退回 debug 签名并照常发布（debug 包装不上正式版，老用户覆盖安装必失败）
          for v in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少签名 secret $v —— 发布包必须是发布密钥签名，请在 Settings→Secrets 配齐 4 项"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maibms-release.jks"
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/maibms-release.jks"

          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:assembleRelease

          SRC=composeApp/build/outputs/apk/release/composeApp-release.apk
          test -f "$SRC" || { echo "::error::未找到构建产物 $SRC"; exit 1; }
          OUT="maibms-${{ needs.version.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::未找到 apksigner"; exit 1; }
          "$APKSIGNER" verify --print-certs "$OUT"
          ls -la "$OUT"
          echo "built: $OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 7

  ipa:
    name: 构建 ipa
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: 构建未签名 ipa（Release 配置，包体最小）
        id: ipa
        uses: ./.github/actions/build-unsigned-ipa
        with:
          asset_name: maibms-${{ needs.version.outputs.name }}-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ steps.ipa.outputs.ipa }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 提交版本号并发布
    needs: [version, apk, ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 提交版本号并同步官网兜底
        env:
          OLD_CODE: ${{ needs.version.outputs.old_code }}
          CODE: ${{ needs.version.outputs.code }}
          NAME: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GRADLE_FILE=composeApp/build.gradle.kts
          SITE=docs/index.html

          # 构建期间可能有人又推了版本号：此时直接停，别把基于旧版本构建出来的包
          # 当成最新版发布（tag 会指向一个和包内容对不上的提交）
          CUR_CODE="$(grep -oE 'versionCode = [0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')"
          if [ "$CUR_CODE" != "${OLD_CODE}" ]; then
            echo "::error::main 上的 versionCode 已从 ${OLD_CODE} 变成 ${CUR_CODE}（构建期间有人改过版本），本次发布中止，请重新触发"
            exit 1
          fi

          sed -i "s/versionCode = [0-9]\+/versionCode = ${CODE}/" "$GRADLE_FILE"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${NAME}\"/" "$GRADLE_FILE"

          # 顺手同步官网的内联版本兜底：接口拉不到时官网显示的就是那几个常量，
          # 不跟着发版走就会一直停在旧版本（国内访问 api.github.com 慢或被挡并不少见）
          if [ -f "$SITE" ]; then
            sed -i -E "s|^([[:space:]]*var FALLBACK_TAG_STABLE = ).*|\1\"${TAG}\";|" "$SITE"
            sed -i -E "s|^([[:space:]]*var FALLBACK_VER_STABLE = ).*|\1\"${NAME}\";|" "$SITE"
            # 测试版那两组取仓库里最新的预发布——正式版发布本身不产生新的 pre-release
            BETA_TAG="$(gh release list --limit 30 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // empty' 2>/dev/null || true)"
            if [ -n "$BETA_TAG" ]; then
              sed -i -E "s|^([[:space:]]*var FALLBACK_TAG_BETA = ).*|\1\"${BETA_TAG}\";|" "$SITE"
              sed -i -E "s|^([[:space:]]*var FALLBACK_VER_BETA = ).*|\1\"${BETA_TAG#v}\";|" "$SITE"
            else
              echo "::warning::仓库里没有预发布，官网的测试版兜底保持不变"
            fi
            echo "--- 官网版本兜底已同步 ---"
            grep -E "var FALLBACK_(TAG|VER)_(STABLE|BETA)" "$SITE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE_FILE"
          if [ -f "$SITE" ]; then git add "$SITE"; fi
          # 写成 if 而不是 `A && {...}`：本步骤开了 set -e，前者行为更明确
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
            exit 0
          fi
          # [skip ci] 防止这次提交又触发一轮 Beta 构建
          git commit -m "chore(release): v${NAME} [skip ci]" \
            -m "同一次提交里把官网 docs/index.html 的内联版本兜底同步到本次发布。"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VER: ${{ needs.version.outputs.name }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="正式版 **v${VER}**，构建自 \`${GITHUB_SHA:0:7}\`。

          - \`maibms-${VER}.apk\` —— 已签名，可直接覆盖安装
          - \`maibms-${VER}-unsigned.ipa\` —— 未签名，需用 Sideloadly / 爱思助手 自签安装

          Signed stable build **v${VER}**. The IPA is unsigned and needs self-signing."
          fi
          # tag 必须指向刚 push 的版本号提交（HEAD），不能指向触发时的旧 SHA——
          # 否则 tag 里的源码 versionCode/versionName 还是上一版，与发布的包对不上
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG 已存在（重跑），仅上传产物覆盖"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "v${VER}" \
              --target "$TARGET" \
              --latest \
              --notes "$NOTES"
            gh release upload "$TAG" dist/*
          fi
          echo "published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
