name: Release

# 手动发布正式版：
#   Actions -> Release -> Run workflow（version 留空则自动把版本号末位 +1）
#
# 流程：递增 versionCode/versionName -> 提交 -> 用 secrets 里的密钥签名构建 ->
#       上传构建产物 -> 打 tag <versionCode>-<versionName> 发布正式 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '新的 versionName（例如 0.2.0）。留空则自动把末位 +1'
        required: false
      notes:
        description: '发布说明（留空自动生成）'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK（ANDROID_SDK_ROOT）；不用 android-actions/setup-android，
      # 它的新版本会因为已移除的 legacy "tools" 包而失败
      - name: Ensure Android platform and build-tools
        run: |
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Bump the version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -e
          GRADLE_FILE=composeApp/build.gradle.kts
          OLD_CODE="$(grep -oE 'versionCode = [0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')"
          OLD_NAME="$(grep -oE 'versionName = "[^"]*"' "$GRADLE_FILE" | head -1 | cut -d'"' -f2)"
          NEW_CODE=$((OLD_CODE + 1))
          if [ -n "$VERSION_INPUT" ]; then
            NEW_NAME="$VERSION_INPUT"
          else
            # 末位自增：0.1.0 -> 0.1.1；BEGIN{OFS} 必须在改字段前设置，否则重建出来会变成 "0 1 1"
            NEW_NAME="$(echo "$OLD_NAME" | awk -F. 'BEGIN{OFS="."} { $NF = $NF + 1; print }')"
          fi
          case "$NEW_NAME" in
            *beta*|*alpha*|*Beta*|*Alpha*)
              echo "::error::'$NEW_NAME' 看着像预发布版本；beta 由 Beta 工作流发布"
              exit 1 ;;
          esac
          if [ "$NEW_NAME" = "$OLD_NAME" ]; then
            echo "::error::'$NEW_NAME' 已是当前版本——请传入新的 versionName，或留空让它自增"
            exit 1
          fi
          sed -i "s/versionCode = [0-9]\+/versionCode = ${NEW_CODE}/" "$GRADLE_FILE"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${NEW_NAME}\"/" "$GRADLE_FILE"
          echo "version: ${OLD_NAME} (${OLD_CODE}) -> ${NEW_NAME} (${NEW_CODE})"
          grep -E 'versionCode|versionName' "$GRADLE_FILE"
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_CODE}-${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/build.gradle.kts
          # [skip ci] 防止这次提交又触发一轮 Beta 构建
          git commit -m "chore(release): v${{ steps.version.outputs.name }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:desktopTest

      - name: Build signed APK
        id: build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 SIGNING_KEYSTORE_BASE64 —— 发布包必须是签名包，请先配置签名 secrets"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maibms-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/maibms-release.jks" >> "$GITHUB_ENV"

          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:assembleRelease

          SRC=composeApp/build/outputs/apk/release/composeApp-release.apk
          test -f "$SRC" || { echo "::error::未找到构建产物 $SRC"; exit 1; }
          OUT="maibms-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$OUT" | head -4
          echo "built: $OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.name }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="正式版 **v${VER}**，已签名，可直接覆盖安装。

          Signed stable build **v${VER}**, built from \`${GITHUB_SHA}\`. 安装与构建说明见 README.md。"
          fi
          gh release create "$TAG" \
            --title "v${VER}" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
          gh release upload "$TAG" "${{ steps.build.outputs.apk }}"
          echo "published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
