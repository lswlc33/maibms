<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d232a">
<title>麻衣 BMS · 控制台主题</title>
<meta name="description" content="麻衣 BMS 网页版（控制台主题）：Bootstrap 5 侧栏仪表盘布局，桌面与平板上并排看更多数据。">
<link rel="icon" href="../images/app-icon-512.png">

<!--
  控制台主题（布局实验①）：**侧栏仪表盘**。
  与其余主题的差别在"导航与内容的关系"：别的主题是手机竖屏的底部标签 + 单列卡片，
  这里是桌面式的左侧边栏 + 多列仪表盘网格（≥992px 出侧栏，窄屏退化成顶部横向标签）。
  组件用 Bootstrap 5（2025 年仍是最广泛使用的 CSS 框架，CDN 引入免构建、vanilla 友好）。
-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100vh; }
  body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }

  /* ---------- 布局骨架 ---------- */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 208px; flex: 0 0 auto;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
    padding: 14px 10px;
  }
  .sidebar .brand {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 10px 16px; font-weight: 650; font-size: 14.5px;
    text-decoration: none; color: inherit;
  }
  .sidebar .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .sidebar .nav-link {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13.5px; text-decoration: none; color: inherit;
    opacity: .72; cursor: pointer; border: 0; background: none; width: 100%; text-align: left;
  }
  .sidebar .nav-link:hover { opacity: 1; background: var(--bs-tertiary-bg); }
  .sidebar .nav-link.active { opacity: 1; background: var(--bs-primary-bg-subtle); font-weight: 600; }
  .sidebar .foot { margin-top: auto; padding: 10px; font-size: 11px; opacity: .5; }

  .main {
    flex: 1 1 auto; min-width: 0;
    padding: 14px 18px calc(28px + env(safe-area-inset-bottom));
  }

  /* 窄屏：侧栏退化成顶部横向滚动标签 */
  @media (max-width: 991.98px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 20;
      flex-direction: row; align-items: center; gap: 6px;
      padding: 8px 10px; overflow-x: auto;
    }
    .sidebar .brand { padding: 0 10px 0 0; }
    .sidebar .brand img { width: 24px; height: 24px; }
    .sidebar .brand .t { display: none; }
    .sidebar .nav-link { white-space: nowrap; width: auto; padding: 6px 11px; }
    .sidebar .foot { display: none; }
    .main { padding: 12px 12px 24px; }
  }

  /* ---------- 顶栏 ---------- */
  .pagehead {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .pagehead h1 { font-size: 18px; font-weight: 700; margin: 0; flex: 1 1 auto; }

  /* ---------- 仪表盘网格（bento 式） ---------- */
    /* 注意：Bootstrap 5.1+ 自带 .grid 组件类（以及 .col-* 列类），
     会覆盖这里的定义（实测 grid-template-columns 变成 auto-fit，
     面板被挤成 132px 窄列）。所以这套主题的自定义网格类都带 mw- 前缀。
     另一个坑：1fr 的隐含最小值是 min-content，不可折行的数字/单体网格会把列撑爆——
     要用 minmax(0, 1fr) 显式允许收缩到 0（经典 grid blowout 问题）。 */
  .mw-grid { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .mw-12 { grid-column: span 12; }
  .mw-6  { grid-column: span 6; }
  .mw-8  { grid-column: span 8; }
  .mw-4  { grid-column: span 4; }
  @media (max-width: 767.98px) {
    .mw-6, .mw-8, .mw-4 { grid-column: span 12; }
  }

  .panel .card-body { padding: 14px; }
  .panel-title {
    font-size: 12px; font-weight: 650; letter-spacing: .02em;
    text-transform: uppercase; opacity: .65; margin-bottom: 10px;
  }

  /* ---------- SOC 环 + 概览 ---------- */
  .hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .ring { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring .pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .ring .pct small { font-size: 12px; font-weight: 500; margin-left: 1px; opacity: .55; }
  .hero-info { flex: 1 1 180px; min-width: 0; }
  .hero-info .name { font-size: 17px; font-weight: 650; }
  .hero-info .state { font-size: 13px; opacity: .7; margin-top: 2px; }
  .hero-info .cap { font-size: 12.5px; opacity: .7; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .badge-soft {
    font-size: 12px; padding: 4px 11px; border-radius: 999px;
    background: var(--bs-tertiary-bg); white-space: nowrap;
  }
  .badge-soft.on { background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); }
  .badge-soft.warn { background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); }
  .badge-soft.bad { background: var(--bs-danger-bg-subtle); color: var(--bs-danger-text-emphasis); }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  /* ---------- 单体网格 ---------- */
  .cells {
    display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
  }
  .cell {
    position: relative; text-align: center;
    border-radius: 10px; padding: 7px 4px;
    background: var(--bs-tertiary-bg);
    border: 2px solid transparent;
    font-variant-numeric: tabular-nums;
  }
  .cell .idx { font-size: 9.5px; opacity: .55; }
  .cell .v { font-size: 13px; font-weight: 600; }
  .cell.max { border-color: var(--bs-warning-text-emphasis); }
  .cell.min { border-color: var(--bs-primary-text-emphasis); }
  .cell.missing .v { opacity: .35; }
  .cell .bal {
    position: absolute; top: 5px; right: 5px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--bs-success);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 13px; font-size: 11.5px; opacity: .65; margin-top: 9px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* ---------- 温度 / 趋势 ---------- */
  .temps { display: flex; flex-wrap: wrap; gap: 8px; }
  .temp {
    flex: 1 1 80px; text-align: center;
    background: var(--bs-tertiary-bg); border-radius: 12px; padding: 8px 10px;
  }
  .temp .k { font-size: 10.5px; opacity: .6; }
  .temp .v { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .temp.hot .v { color: var(--bs-danger-text-emphasis); }
  .temp.cold .v { color: var(--bs-primary-text-emphasis); }

  .trend { width: 100%; height: 76px; display: block; }

  /* ---------- 通用 ---------- */
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint { font-size: 12px; opacity: .6; margin: 8px 0 0; line-height: 1.6; }
  .empty { text-align: center; padding: 30px 14px; opacity: .7; }
  .empty h3 { font-size: 15px; font-weight: 600; }
  .empty p { font-size: 13px; margin-bottom: 0; }

  .param-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 2px; border-bottom: 1px solid var(--bs-border-color);
  }
  .param-row:last-child { border-bottom: none; }
  .param-row .main { flex: 1; min-width: 0; }
  .param-row .title { font-size: 13.5px; }
  .param-row .desc { font-size: 11.5px; opacity: .6; margin-top: 1px; }
  .param-row .val { font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .param-row .val.dim { opacity: .45; }
  .param-row .val small { font-size: 11px; margin-left: 2px; opacity: .6; }

  .log-box {
    max-height: 46vh; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  .log-box .w { color: var(--bs-warning-text-emphasis); }
  .log-box .e { color: var(--bs-danger-text-emphasis); }
  .log-box .d { opacity: .5; }
</style>
</head>
<body>

<div class="layout">
  <nav class="sidebar bg-body-tertiary border-end" id="sidebar">
    <a class="brand" href="#?v=7fbba2c961" onclick="return false">
      <img src="../images/app-icon-512.png" alt="">
      <span class="t">麻衣 BMS</span>
    </a>
    <div id="sideNav"></div>
    <div class="foot">数据层与三套主题共用<br>协议仅一份实现</div>
  </nav>

  <main class="main" id="content"></main>
</div>

<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content"><div class="modal-body" id="modalBody"></div></div>
  </div>
</div>

<script src="maibms-host.js?v=7fbba2c961"></script>
<script src="../maibms-data.js?v=7fbba2c961"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
