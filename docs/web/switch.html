<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>切换主题 · 麻衣 BMS</title>
<link rel="icon" href="../images/app-icon-512.png">
<!--
  主题切换页：独立一页（不放各主题内部），这样加主题只要在这里多一张卡。

  卡片列表来自 window.Maibms.themes()，与各主题页的"我是谁"共用一个清单来源；
  数据层加载失败时退化成内联的静态清单（见脚本末尾的兜底），保证这一页永远能用。
-->
<link rel="stylesheet" href="switch.css?v=9fba43ca92">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html?v=9fba43ca92" id="backLink">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </a>
    <h1>切换主题</h1>
    <p class="sub">同一个数据层，不同的界面风格。换主题不影响连接状态与已保存的配置。</p>
  </header>

  <div class="themes" id="themes">
    <div class="loading">正在读取主题列表…</div>
  </div>

  <div class="preview">
    <h2>没有保护板也能看</h2>
    <p>任意主题页面后面加 <code>?preview=1</code> 即可载入一份内置示例数据，
      把总览、单体、温度、趋势、参数全画出来。它不写任何持久化状态。</p>
    <div class="preview-actions" id="previewActions"></div>
  </div>

  <footer>
    <a href="../index.html?v=9fba43ca92">官网首页</a>
    <span>·</span>
    <a href="https://github.com/lswlc33/maibms" target="_blank" rel="noopener">开源仓库</a>
  </footer>
</div>

<script src="maibms-host.js?v=9fba43ca92"></script>
<script src="../maibms-data.js?v=9fba43ca92"></script>
<script>
/* 启动数据层：bundle 以 UMD 输出，main() 不会自动跑，必须显式调用（幂等） */
if (window.MaibmsBoot) window.MaibmsBoot();
</script>
<script src="theme-switch.js?v=9fba43ca92"></script>
</body>
</html>
