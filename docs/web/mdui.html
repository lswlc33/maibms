<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>麻衣 BMS · Material 主题</title>
<meta name="description" content="麻衣 BMS 网页版（Material 主题）：用 mdui 组件库重绘的界面，在安卓 Chrome 里直连保护板。">
<link rel="icon" href="../images/app-icon-512.png">

<!-- mdui 2：Material You 组件库。CDN 引入，不需要构建。
     离线/内网环境下会加载失败，页面会降级成"提示+原始 HTML"（见 theme-mdui.js 的兜底）。 -->
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<!-- Material Icons（Filled 变体）：mdui 的 `icon`/`name` 属性靠这个字体渲染。
     不引就会出现"图标名当文字显示"（palette 渲染成 pal）。

     用 Filled 变体的原因：它的图标名**不需要后缀**（`name="delete"`），
     而 Outlined/Rounded/Sharp/TwoTone 要加 `--outlined` 之类的双横线后缀
     （mdui 2 的约定是 `--`，不是 `-`，写成 `-round` 会渲染成文字）。

     fonts.googleapis.com 国内不可达（实测超时），走 fonts.loli.net 镜像——
     Google Fonts 的国内反代，内容一致。 -->
<link rel="stylesheet" href="https://fonts.loli.net/icon"?family=Material+Icons">

<link rel="stylesheet" href="theme-mdui.css">
</head>
<body class="mdui-theme-auto">
<div id="app">
  <div class="boot">
    <mdui-circular-progress></mdui-circular-progress>
    <p>正在加载…</p>
  </div>
</div>

<!-- 数据层：BLE + 协议 + 状态桥（Kotlin/JS 产物，与默认主题共用同一个文件） -->
<script src="maibms-host.js"></script>
<script src="../maibms-data.js"></script>
<script>
/* 启动数据层：bundle 以 UMD 输出，main() 不会自动跑，必须显式调用（幂等） */
if (window.MaibmsBoot) window.MaibmsBoot();
</script>
<script src="theme-mdui.js"></script>
</body>
</html>
