<!doctype html>
<html lang="zh-CN" data-theme="dim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d232a">
<title>麻衣 BMS · Daisy 主题</title>
<meta name="description" content="麻衣 BMS 网页版（daisyUI 主题）：Tailwind + daisyUI 组件重绘，在安卓 Chrome 里直连保护板。">
<link rel="icon" href="../images/app-icon-512.png">

<!--
  Daisy 主题：Tailwind CSS + daisyUI 5。
  选它作为第三个主题的理由：daisyUI 是 Tailwind 生态里最流行的组件库，
  语义化类名（btn / card / badge / stat）与 mdui 的 Web Component 路线完全不同，
  正好用来验证"换一套 UI 技术栈不影响数据层"。

  CDN 两个都用 jsDelivr（国内可达性明显好于 unpkg，实测过）。
  daisyUI 已经包含 Tailwind 的组件层，所以先加载 Tailwind 运行时再叠 daisyUI 样式。
-->
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  // Tailwind 运行时配置：启用 daisyUI 的语义色，并把字体换成中文优先
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"PingFang SC"', '"HarmonyOS Sans SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  /* 只有数据可视化（SOC 环、单体网格、趋势线）需要少量自定义样式：
     daisyUI 没有"电池环"这种组件，硬套卡片反而更丑。 */
  html, body { margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }

  .boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; min-height: 60vh;
  }

  /* 能量流向条：虚线用 currentColor（颜色由 text-* 类给），方向由 keyframes 决定 */
  .flow-dash {
    background-image: repeating-linear-gradient(90deg, transparent 0 7px, currentColor 7px 15px);
    opacity: .55;
  }
  .flow-fwd { animation: daisy-flow-r 1.1s linear infinite; }
  .flow-rev { animation: daisy-flow-l 1.1s linear infinite; }
  @keyframes daisy-flow-r { from { transform: translateX(0); } to { transform: translateX(-15px); } }
  @keyframes daisy-flow-l { from { transform: translateX(0); } to { transform: translateX(15px); } }

  .band-bal { box-shadow: 0 0 0 2px var(--fallback-b1, #1d232a), 0 0 0 3.5px var(--fallback-su, #36d399); }

  /* 宽屏双列（≥768px）：横幅/摘要通栏，卡片两两并排 */
  @media (min-width: 768px) {
    #content { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; align-items: start; }
    #content > * { margin-top: 0 !important; grid-column: 1 / -1; }
    #content > .card { grid-column: auto / span 1; }
    #content > .card:only-child { grid-column: 1 / -1; }
  }

  .soc-ring { position: relative; width: 96px; height: 96px; flex: 0 0 auto; }
  .soc-ring svg { transform: rotate(-90deg); display: block; }
  .soc-ring .pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .soc-ring .pct small { font-size: 12px; font-weight: 500; margin-left: 1px; opacity: .6; }

  .cells {
    display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  }
  .cell {
    position: relative; text-align: center;
    border-radius: 10px; padding: 7px 4px;
    font-variant-numeric: tabular-nums;
    border: 2px solid transparent;
    background: hsl(var(--b2));
  }
  .cell .idx { font-size: 9.5px; opacity: .6; }
  .cell .v { font-size: 13px; font-weight: 600; }
  .cell.max { border-color: hsl(var(--wa)); }
  .cell.min { border-color: hsl(var(--in)); }
  .cell.missing .v { opacity: .35; }
  .cell .bal {
    position: absolute; top: 5px; right: 5px;
    width: 5px; height: 5px; border-radius: 50%;
    background: hsl(var(--su));
  }

  .trend { width: 100%; height: 68px; display: block; }

  .log-box {
    max-height: 46vh; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-all;
    user-select: text;
  }
  .log-box .w { color: hsl(var(--wa)); }
  .log-box .e { color: hsl(var(--er)); }
  .log-box .d { opacity: .55; }
</style>
</head>
<body class="min-h-screen bg-base-100 text-base-content">

<div id="app">
  <div class="boot">
    <span class="loading loading-spinner loading-lg"></span>
    <p class="text-base-content/60 text-sm">正在加载…</p>
  </div>
</div>

<div class="toast toast-end toast-bottom z-50" id="toastBox"></div>

<script src="maibms-host.js?v=968162e76b"></script>
<script src="../maibms-data.js?v=968162e76b"></script>
<script>
  /* 启动数据层：bundle 以 IIFE 输出，main() 会自动跑；这里再显式调一次兜底（幂等） */
  if (window.MaibmsBoot) window.MaibmsBoot();
</script>
<script src="theme-daisy.js?v=968162e76b"></script>
</body>
</html>
