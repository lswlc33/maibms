<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>麻衣 BMS · 杂志主题</title>
<meta name="description" content="麻衣 BMS 网页版（杂志主题）：排版优先的阅读式界面，无卡片、无盒子，用字号与留白组织信息。">
<link rel="icon" href="../images/app-icon-512.png">

<!--
  杂志主题（布局实验③）：**排版优先**。
  与其余主题的差别：
   · 没有"卡片/盒子"——信息靠字号对比、细分割线与留白组织，像杂志的数据页；
   · SOC 是一行 120px 的特大数字，不是进度环；
   · 导航是纯文字链接（当前项下划线），没有底栏；
   · 用 Pico CSS（classless，样式直接作用于语义 HTML）打底，自定义样式只做字号与分隔。
-->
<!-- 非阻塞加载：Pico 挂起时若用普通 <link> 会拖住整页解析（实测白屏），
     media="print" 让它在首屏不生效，加载完成后由 onload 切回 all。
     加载失败则保持 media="print"——此时 <style> 里的兜底变量与基础排版接管。 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css"
      media="print" onload="this.media='all'" onerror="this.disabled=true">
<style>
  /* Pico classless 打底；下面只改"杂志化"的部分 */

  /* CDN 兜底：Pico 若加载失败（国内网络/离线），页面会退化成无样式裸 HTML
     （实测：白底、无间距、按钮连成一片）。这里先把 Pico 用到的**变量与最小基础样式**
     就地定义成杂志风的默认值；Pico 正常加载时它的 :root 变量会覆盖这里。
     变量名必须与 Pico 一致（--pico-*）。 */
  :root {
    --pico-background-color: #14171c;
    --pico-color: #e6e8eb;
    --pico-muted-color: #9aa0a8;
    --pico-muted-border-color: #262b33;
    --pico-primary: #5b9bd5;
    --pico-secondary-background: #1d222a;
    --pico-block-spacing-vertical: 1rem;
    --pico-block-spacing-horizontal: 1rem;
    --pico-font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --pico-background-color: #fbfbfc;
      --pico-color: #1b1f24;
      --pico-muted-color: #6b7280;
      --pico-muted-border-color: #e3e6ea;
      --pico-secondary-background: #f0f2f5;
      --pico-primary: #2c6fb5;
    }
  }
  body {
    margin: 0;
    background: var(--pico-background-color);
    color: var(--pico-color);
    font-family: var(--pico-font-family);
    line-height: 1.6;
    font-size: 15px;
  }
  /* 只兜最容易被"裸 HTML"破坏的几处：容器宽度、按钮/输入、边距 */
  body > header, body > main {
    max-width: 700px; margin: 0 auto;
    padding: 0 var(--pico-block-spacing-horizontal);
  }
  h1, h2, h3 { line-height: 1.25; }
  button, input, select {
    font: inherit; font-size: 13.5px;
    color: inherit; background: var(--pico-secondary-background);
    border: 1px solid var(--pico-muted-border-color);
    border-radius: 4px; padding: 6px 12px;
  }
  button { cursor: pointer; margin: 2px 6px 2px 0; }
  a { color: var(--pico-primary); }
  p { margin: .6em 0; }

  html { scroll-behavior: smooth; }
  body {
    padding-top: 8px;
    padding-bottom: 64px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  /* ---------- 顶栏（纯文字导航） ---------- */
  .top {
    display: flex; align-items: baseline; gap: 18px;
    padding: 4px 0 14px;
    border-bottom: 1px solid var(--pico-muted-border-color);
    flex-wrap: wrap;
  }
  .top .brand { font-weight: 700; letter-spacing: .01em; }
  .top .links { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; }
  .top .links a {
    color: var(--pico-muted-color);
    text-decoration: none;
    font-size: 14px;
    padding-bottom: 2px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .top .links a.on {
    color: var(--pico-color);
    border-bottom-color: var(--pico-primary);
    font-weight: 600;
  }
  .top .links a:hover { color: var(--pico-color); }
  .top .status { font-size: 12.5px; color: var(--pico-muted-color); }

  /* ---------- 杂志式 SOC ---------- */
  .soc-hero { padding: 18px 0 6px; border-bottom: 1px solid var(--pico-muted-border-color); }
  .soc-label {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--pico-muted-color);
    margin-bottom: 0;
  }
  .soc-num {
    font-size: clamp(96px, 26vw, 150px);
    line-height: .95;
    font-weight: 200;
    letter-spacing: -.03em;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .soc-num small { font-size: 26px; font-weight: 300; color: var(--pico-muted-color); margin-left: 8px; }
  .soc-sub {
    margin: 4px 0 0;
    font-size: 14.5px;
    color: var(--pico-muted-color);
  }

  /* ---------- 指标行（大数字 + 小标签，横排） ---------- */
  .figures {
    display: grid; gap: 6px 28px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    padding: 16px 0;
    border-bottom: 1px solid var(--pico-muted-border-color);
  }
  .figure .v {
    font-size: 34px; line-height: 1.1; font-weight: 250;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .figure .v small { font-size: 15px; font-weight: 300; color: var(--pico-muted-color); margin-left: 3px; }
  .figure .k {
    font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--pico-muted-color); margin-top: 3px;
  }

  /* ---------- 章节（小标题 + 内容，无盒子） ---------- */
  section { padding: 14px 0 4px; }
  section > h2 {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 600;
    color: var(--pico-muted-color);
    margin: 0 0 10px;
    display: flex; align-items: baseline; gap: 10px;
  }
  section > h2 .n { font-weight: 400; }
  section > h2::after {
    content: ""; flex: 1;
    border-top: 1px solid var(--pico-muted-border-color);
    transform: translateY(-3px);
  }

  /* 键值行 */
  .rows { display: grid; gap: 0; }
  .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--pico-muted-border-color);
  }
  .row:last-child { border-bottom: none; }
  .row .k { font-size: 14px; }
  .row .k small { display: block; font-size: 11.5px; opacity: .55; margin-top: 1px; }
  .row .v {
    font-size: 20px; font-weight: 350;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .row .v small { font-size: 12.5px; font-weight: 300; opacity: .6; margin-left: 2px; }
  .row .v.dim { opacity: .4; }
  .row.click { cursor: pointer; }
  .row.click:hover .k { color: var(--pico-primary); }

  /* 单体：紧凑表 */
  .cellgrid {
    display: grid; gap: 4px 22px;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  }
  .cellrow {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 3px 0;
    border-bottom: 1px dotted var(--pico-muted-border-color);
    font-variant-numeric: tabular-nums;
  }
  .cellrow .idx { font-size: 11px; opacity: .5; }
  .cellrow .v { font-size: 14.5px; font-weight: 400; }
  .cellrow.max .v { font-weight: 650; color: var(--pico-color); }
  .cellrow.min .v { opacity: .6; }
  .cellrow.missing .v { opacity: .3; }
  .cellrow .bal { font-size: 10px; color: var(--pico-primary); margin-left: 4px; }

  /* 状态词（MOS/均衡/告警）用带点的文字，不做胶囊 */
  .word { white-space: nowrap; }
  .word::before {
    content: "●"; font-size: 9px; margin-right: 6px; vertical-align: 1px;
    color: var(--pico-muted-color);
  }
  .word.on::before { color: var(--pico-primary); }
  .word.warn::before { color: var(--pico-warning); }
  .word.bad::before { color: var(--pico-danger); }

  /* ---------- 弹层（Pico dialog 语义用法） ---------- */
  dialog h3 { font-size: 15px; }
  dialog .sub { font-size: 12.5px; color: var(--pico-muted-color); margin: 0 0 12px; }
  dialog label { font-size: 12px; color: var(--pico-muted-color); }

  /* ---------- 按钮（Pico 已有基础样式，这里只调尺寸） ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .actions button, .actions a {
    font-size: 13px; padding: 8px 16px; margin: 0;
  }
  button.linklike {
    background: none; border: none; color: var(--pico-primary);
    cursor: pointer; font: inherit; font-size: 13.5px;
    padding: 0; text-decoration: underline; width: auto; margin: 0;
  }

  /* 日志 */
  .log {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
    max-height: 52vh; overflow-y: auto;
    user-select: text;
  }
  .log .w { color: var(--pico-warning); }
  .log .e { color: var(--pico-danger); }
  .log .d { opacity: .5; }

  .muted { color: var(--pico-muted-color); font-size: 12.5px; line-height: 1.7; }
  .empty { padding: 22px 0; color: var(--pico-muted-color); text-align: center; font-size: 13.5px; }

  /* ---------- 健康摘要 / 能量流 / 分布带 / 最弱串（杂志排） ---------- */
  .standfirst {
    display: flex; align-items: center; gap: 9px;
    font-size: 13.5px; font-weight: 550;
    border-top: 1px solid var(--pico-muted-border-color);
    padding-top: 10px; margin: 0 0 4px;
  }
  .standfirst .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .standfirst.ok .dot { background: #2e7d43; }
  .standfirst.ok { color: #2e7d43; }
  .standfirst.warn .dot { background: #b26a00; }
  .standfirst.warn { color: #b26a00; }
  .standfirst.bad .dot { background: #c0392b; }
  .standfirst.bad { color: #c0392b; }

  .flowline { margin: 0 0 4px; font-size: 14px; color: var(--pico-muted-color); }
  .flowline .k { letter-spacing: .5px; }
  .flowline strong { color: var(--pico-color); font-variant-numeric: tabular-nums; }
  .flowline.rev strong { color: #3d7bd0; }
  .flowline.fwd strong { color: #2e7d43; }

  .band { position: relative; height: 26px; border-radius: 13px; background: var(--pico-secondary-background); }
  .band .bdot {
    position: absolute; top: 50%; width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px; border-radius: 50%;
    border: 1px solid var(--pico-background-color);
  }
  .band .bdot.bal { box-shadow: 0 0 0 2px var(--pico-background-color), 0 0 0 3.5px #2e7d43; }
  .band-lab { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--pico-muted-color); margin: 3px 0 10px; }

  .weak { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; }
  .weak .k { color: #c0392b; font-weight: 650; font-size: 11.5px; }
  .weak .w { font-variant-numeric: tabular-nums; font-weight: 600; }
  .weak .sep { color: var(--pico-muted-color); }

  /* Pico 在窄屏断点清零了 body>main 的左右内边距，杂志排行的细线行会贴到屏幕边 */
  @media (max-width: 575px) {
    body > header, body > main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<!-- top 与 main 必须是 body 的直接子元素：Pico classless 的容器规则
     （body>header / body>main）靠直接子代选择器命中，套一层 div 就全部落空
     ——表现为窄屏零内边距、宽屏不居中（全出血）。 -->
<header class="top" id="top"></header>
<main id="content"></main>

<script src="maibms-host.js?v=5829f08faa"></script>
<script src="../maibms-data.js?v=5829f08faa"></script>
<script src="theme-paper.js?v=5829f08faa"></script>
</body>
</html>
